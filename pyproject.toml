[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthgen"
version = "0.2.0"
description = "Schema-validated synthetic tabular data from an LLM, with batching, dedup and a quality report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saeed Sabzeh" }]
keywords = ["synthetic-data", "llm", "openai", "pydantic", "data-generation", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["openai>=1.40", "pydantic>=2.7", "python-dotenv>=1.0"]

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=15.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
synthgen = "synthgen.cli:main"

[project.urls]
Homepage = "https://github.com/SaeedSabzeh/synthgen"
Issues = "https://github.com/SaeedSabzeh/synthgen/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/synthgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
